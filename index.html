<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ProjectDrawn</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/launcher.css">
</head>
<body>
  <section id="launcher" class="launcher" hidden></section>

  <div id="app" class="app" hidden>
    <header class="topbar">
      <button id="btn-back" class="btn btn--ghost" data-i18n="launcher.back"></button>
      <div class="topbar__brand" data-i18n="app.name"></div>
      <nav id="breadcrumbs" class="breadcrumbs" aria-label="breadcrumbs"></nav>
      <div class="topbar__actions">
        <button id="btn-link" class="btn btn--ghost topbar__link"></button>
        <button id="btn-undo" class="btn btn--icon" data-i18n-title="history.undo" disabled>&#8630;</button>
        <button id="btn-redo" class="btn btn--icon" data-i18n-title="history.redo" disabled>&#8631;</button>
        <button id="btn-settings" class="btn btn--icon" data-i18n-title="settings.title">&#9881;</button>
      </div>
    </header>

    <main id="workspace" class="workspace">
      <canvas id="stage" class="stage"></canvas>
    </main>

    <footer class="statusbar">
      <span id="status-message" class="statusbar__message"></span>
      <span id="status-save" class="statusbar__item statusbar__save"></span>
      <span id="status-coords" class="statusbar__item"></span>
      <span id="status-zoom" class="statusbar__item"></span>
    </footer>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>

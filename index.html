<!doctype html>
<html lang="pt-BR">

  <title>ProjectDrawn</title>

<body>
  <canvas id="board"></canvas>
  <aside class="hint">
    <b>Espaço</b> ou <b>botão direito</b> + arrastar: mover a vista ·
    <b>Roda</b>: zoom · <b>F</b>: enquadrar · <b>Home</b>: 100%<br>
    <b>Clique</b>/<b>Shift+clique</b>: selecionar · arrastar no vazio: retângulo
    (→ inteiro dentro, ← toca) · <b>Ctrl+A</b> · <b>Esc</b> · <b>Delete</b> · <b>Alt</b> ao soltar: sem encaixe
  </aside>
  <script type="module" src="js/main.js"></script>
</body>
</html>
